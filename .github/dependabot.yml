# Dependabot の設定。bun の依存と GitHub Actions を週 1 回更新する
# patch / minor は CI（build）と dependabot-policy が緑なら自動マージ（.github/workflows/dependabot-automerge.yml）
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:                 # 週 1 回の更新は patch と minor を 1 本にまとめる
        applies-to: version-updates
        update-types: ["minor", "patch"]
      security:                        # security updates も同じエコシステムで 1 本にまとめる
        applies-to: security-updates
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    groups:
      actions:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
